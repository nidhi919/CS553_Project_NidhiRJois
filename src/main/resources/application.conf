# ============================================
# Akka Configuration
# ============================================
akka {
  loglevel = "INFO"
  
  actor {
    provider = "local"
    
    serialization-bindings {
      "com.uic.cs553.distributed.framework.DistributedMessage" = jackson-json
    }
  }
  
  coordinated-shutdown {
    exit-jvm = on
  }
}

# ============================================
# NetGameSim Akka Simulator Configuration
# ============================================
netgamesim {
  # Default graph file
  graph-file = "graph.dot"

  # Default run duration
  run-duration = "30s"

  # Default algorithm: simple, paxos, pk
  algorithm = "simple"

  # Random seed for reproducibility
  seed = 42

  # Traffic generation settings
  traffic {
    tick-interval-ms = 1000

    default-pdf = [
      { message-type = "PING", probability = 0.4 },
      { message-type = "WORK", probability = 0.3 },
      { message-type = "GOSSIP", probability = 0.2 },
      { message-type = "ACK", probability = 0.1 }
    ]
  }

  # Edge label configuration
  edge-labels {
    default = ["PING", "WORK", "CONTROL", "ACK", "GOSSIP"]
  }

  # Initiator node configuration
  initiators {
    timer-node = 0
    timer-interval-ms = 1000
  }
}